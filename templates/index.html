<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatHunter Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-4">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            ThreatHunter Dashboard
        </h1>

        <p class="text-muted">
            Security Operations Centre Monitoring
        </p>

    </div>

    <!-- Metric Cards -->

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Total Alerts</h6>

                    <h2>{{ metrics.total_alerts }}</h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Open Cases</h6>

                    <h2>{{ metrics.open_cases }}</h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Critical Alerts</h6>

                    <h2>{{ metrics.critical_alerts }}</h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Threat Intel Hits</h6>

                    <h2>{{ metrics.threat_hits }}</h2>

                </div>
            </div>
        </div>

    </div>

    <!-- Severity Distribution -->

    <div class="row mt-5">

        <div class="col-lg-8 mx-auto">

            <div class="card chart-card">

                <div class="card-body">

                    <h4 class="text-center mb-4">
                        Severity Distribution
                    </h4>

                    <canvas id="severityChart"></canvas>

                </div>

            </div>

        </div>

    </div>

    <!-- Alert Trends -->

    <div class="row mt-5">

        <div class="col-lg-10 mx-auto">

            <div class="card chart-card">

                <div class="card-body">

                    <h4 class="text-center mb-4">
                        Alert Trends
                    </h4>

                    <canvas id="trendChart"></canvas>

                </div>

            </div>

        </div>

    </div>

    <!-- Case Status Monitoring -->

    <div class="row mt-5">

        <div class="col-lg-10 mx-auto">

            <div class="card chart-card">

                <div class="card-body">

                    <h4 class="text-center mb-4">
                        Case Status Monitoring
                    </h4>

                    <canvas id="statusChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

// Severity Pie Chart

const severityCtx = document.getElementById("severityChart");

new Chart(severityCtx, {

    type: "pie",

    data: {

        labels: [
            "Low",
            "Medium",
            "High",
            "Critical"
        ],

        datasets: [{

            data: {{ [
                severity_data["Low"],
                severity_data["Medium"],
                severity_data["High"],
                severity_data["Critical"]
            ] | tojson }},

            backgroundColor: [
                "#28a745",
                "#ffc107",
                "#fd7e14",
                "#dc3545"
            ],

            borderColor: "#ffffff",
            borderWidth: 2

        }]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {
                position: "bottom"
            }

        }

    }

});


// Alert Trends Line Chart

const trendCtx = document.getElementById("trendChart");

new Chart(trendCtx, {

    type: "line",

    data: {

        labels: {{ alert_trends["days"] | tojson }},

        datasets: [{

            label: "Alerts",

            data: {{ alert_trends["alerts"] | tojson }},

            borderColor: "#0d6efd",

            backgroundColor: "rgba(13,110,253,0.2)",

            borderWidth: 3,

            fill: true,

            tension: 0.3

        }]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {
                display: true
            }

        }

    }

});


// Case Status Monitoring

const statusCtx = document.getElementById("statusChart");

new Chart(statusCtx, {

    type: "bar",

    data: {

        labels: {{ case_status_data["statuses"] | tojson }},

        datasets: [{

            label: "Cases",

            data: {{ case_status_data["counts"] | tojson }},

            backgroundColor: [
                "#0d6efd",
                "#ffc107",
                "#fd7e14",
                "#198754"
            ]

        }]

    },

    options: {

        responsive: true,

        scales: {

            y: {
                beginAtZero: true
            }

        }

    }

});

</script>

</body>
</html>
