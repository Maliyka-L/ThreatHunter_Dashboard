<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatHunter Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-4">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            ThreatHunter Dashboard
        </h1>

        <p class="text-muted">
            Security Operations Centre Monitoring
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Total Alerts</h6>

                    <h2>
                        {{ metrics.total_alerts }}
                    </h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Open Cases</h6>

                    <h2>
                        {{ metrics.open_cases }}
                    </h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Critical Alerts</h6>

                    <h2>
                        {{ metrics.critical_alerts }}
                    </h2>

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card metric-card">
                <div class="card-body text-center">

                    <h6>Threat Intel Hits</h6>

                    <h2>
                        {{ metrics.threat_hits }}
                    </h2>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
